stages:
  - lint
  - test
  - generate
  - build-and-publish

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOMODCACHE: $CI_PROJECT_DIR/.go/pkg/mod
default:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
    policy: pull-push

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Lint ────────────────────────────────────────────────────────────────────

lint-go:
  stage: lint
  image:
    name: golangci/golangci-lint:v2.12-alpine
    pull_policy: if-not-present
  script:
    - golangci-lint run --timeout=10m

lint-webui:
  stage: lint
  image:
    name: node:24-alpine
    pull_policy: if-not-present
  cache:
    key:
      files:
        - webui/package-lock.json
    paths:
      - webui/node_modules/
    policy: pull-push
  script:
    - cd webui && npm ci --prefer-offline && npm run lint

# ── Test ────────────────────────────────────────────────────────────────────

test-go:
  stage: test
  image:
    name: golang:1.26-alpine
    pull_policy: if-not-present
  script:
    - go test -count=1 -timeout 180s -v ./internal/...

# ── Docker build & publish ─────────────────────────────────────────────────

build-and-publish:
  stage: build-and-publish
  image:
    name: docker:27
    pull_policy: if-not-present
  variables:
    GIT_DEPTH: 0
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - GIT_TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")
  script:
    - docker build -f deployment/docker/Dockerfile --build-arg VERSION="$GIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
