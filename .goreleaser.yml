project_name: hexmagnet
version: 2

before:
  hooks:
    - go mod tidy
    - npm ci --prefix webui
    - npm run build --prefix webui

builds:
  - id: hexmagnet
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
    main: ./main.go
    binary: hexmagnet
    ldflags:
      - "-s -w -X github.com/hexsans/hexmagnet/internal/version.GitTag={{.Version}}"

archives:
  - id: hexmagnet
    ids:
      - hexmagnet
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  draft: true
  mode: append
  footer: |
    **Full Changelog**: https://github.com/hexsans/hexmagnet/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Docker images

    - `docker pull ghcr.io/hexsans/hexmagnet:{{ .Tag }}`

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  use: github
  sort: "" # left empty for use the same order of output of `git log`
  filters:
    exclude:
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 000
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: Others
      order: 999
