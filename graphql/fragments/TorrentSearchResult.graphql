#import "./TorrentSearch"

fragment TorrentSearchResult on TorrentSearchResult {
  items {
    ...TorrentSearch
  }
  totalCount
  totalCountIsEstimate
  hasNextPage
  aggregations {
    contentType {
      value
      label
      count
      isEstimate
    }
    torrentSource {
      value
      label
      count
      isEstimate
    }
    torrentFileType {
      value
      label
      count
      isEstimate
    }
    language {
      value
      label
      count
      isEstimate
    }
    genre {
      value
      label
      count
      isEstimate
    }
    releaseYear {
      value
      label
      count
      isEstimate
    }
  }
}
